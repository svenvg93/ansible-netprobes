---
# Baseline setup for new or rebuilt netprobes.
#   ansible-playbook playbooks/bootstrap.yml
#   ansible-playbook playbooks/bootstrap.yml --tags timezone|packages|tailscale|speedtest
- name: Find online netprobes
  ansible.builtin.import_playbook: online.yml

- name: Bootstrap
  hosts: netprobes_online
  roles:
    - role: bootstrap
    - role: speedtest
      tags: [speedtest]
