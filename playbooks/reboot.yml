---
# Reboot netprobes a few at a time and check they come back healthy. Never touches the controller.
#   ansible-playbook playbooks/reboot.yml --limit <probe>[,<probe>...]
#   ansible-playbook playbooks/reboot.yml                                  # whole fleet, 25% at a time
#   ansible-playbook playbooks/reboot.yml -e reboot_only_if_required=true  # only where Ubuntu asks for it
#   ansible-playbook playbooks/reboot.yml -e reboot_serial=1               # one probe at a time
- name: Reboot netprobes
  hosts: netprobes
  serial: "{{ reboot_serial | default('25%') }}"
  # A probe that doesn't come back needs hands-on access; stop before rebooting the next batch.
  max_fail_percentage: 0
  vars:
    reboot_only_if_required: false
    reboot_timeout: 600
    reboot_beszel_service: beszel-agent.service
  tasks:
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        msg: Rebooting (Ansible reboot playbook)
      when: reboot_required_file.stat.exists or not (reboot_only_if_required | bool)

    - name: Gather service state
      ansible.builtin.service_facts:

    # Skipped on hosts without the agent.
    - name: Verify the Beszel agent is running
      ansible.builtin.assert:
        that: ansible_facts['services'][reboot_beszel_service]['state'] == 'running'
        fail_msg: "{{ reboot_beszel_service }} is not running on {{ inventory_hostname }}"
        quiet: true
      when:
        - reboot_beszel_service in ansible_facts['services']
        - not ansible_check_mode
