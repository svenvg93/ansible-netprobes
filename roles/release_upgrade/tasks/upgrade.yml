---
# ---- Checks ------------------------------------------------------------------
- name: Only offer LTS releases
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: '^Prompt='
    line: "Prompt={{ release_upgrade_prompt }}"

- name: Check for a new release
  ansible.builtin.command: do-release-upgrade -c
  register: release_upgrade_check
  changed_when: false
  failed_when: release_upgrade_check.rc not in [0, 1]
  check_mode: false

- name: Stop here when there is no new release
  when: release_upgrade_check.rc != 0
  block:
    - name: Report no new release
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is on the newest {{ release_upgrade_prompt }} release ({{ ansible_facts['distribution_version'] }})."

    - name: End this host
      ansible.builtin.meta: end_host

- name: Note the current and the new release
  ansible.builtin.set_fact:
    release_upgrade_plan:
      from: "{{ ansible_facts['distribution_release'] }}"
      to_version: "{{ release_upgrade_check.stdout | regex_search(\"New release '([0-9.]+)\", '\\1') | first }}"

- name: Check free space on /
  ansible.builtin.assert:
    that: >-
      (ansible_facts['mounts'] | selectattr('mount', 'eq', '/') | first)['size_available']
      >= (release_upgrade_min_free_gb | int) * 1024 * 1024 * 1024
    fail_msg: "Less than {{ release_upgrade_min_free_gb }} GB free on /."
    quiet: true

- name: Check dpkg has no half-installed packages
  ansible.builtin.command: dpkg --audit
  register: release_upgrade_audit
  changed_when: false
  failed_when: release_upgrade_audit.stdout | length > 0
  check_mode: false

- name: Report the planned upgrade
  ansible.builtin.debug:
    msg: >-
      {{ 'Would upgrade' if ansible_check_mode else 'Upgrading' }} {{ inventory_hostname }}
      from {{ ansible_facts['distribution_version'] }} ({{ release_upgrade_plan.from }})
      to {{ release_upgrade_plan.to_version }}.

- name: Stop here in check mode
  ansible.builtin.meta: end_host
  when: ansible_check_mode

# ---- Upgrade -----------------------------------------------------------------
- name: Clear the state of earlier upgrades
  ansible.builtin.file:
    path: "{{ release_upgrade_state_dir }}/{{ item }}"
    state: absent
  loop: [prepare.status, upgrade.status, plan.json, finished]

- name: Create the state directory
  ansible.builtin.file:
    path: "{{ release_upgrade_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Saved on the probe so an interrupted run can resume (see main.yml).
- name: Save the plan
  ansible.builtin.copy:
    dest: "{{ release_upgrade_state_dir }}/plan.json"
    content: "{{ release_upgrade_plan | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Pause scheduled apt runs (they start again at boot)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Install the upgrade script
  ansible.builtin.template:
    src: ansible-release-upgrade.sh.j2
    dest: "{{ release_upgrade_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install all pending updates
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    release_upgrade_phase: prepare

- name: Check if a reboot is required before upgrading
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: release_upgrade_reboot_file

# do-release-upgrade refuses to start while a reboot is pending.
- name: Reboot before upgrading
  ansible.builtin.reboot:
    reboot_timeout: "{{ release_upgrade_reboot_timeout }}"
    msg: Rebooting before the release upgrade (Ansible)
  when: release_upgrade_reboot_file.stat.exists

- name: Run do-release-upgrade
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    release_upgrade_phase: upgrade
