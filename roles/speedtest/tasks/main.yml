---
- name: Install Ookla Speedtest CLI from the release tarball
  when: speedtest_install | bool
  block:
    # Must run before the binary is placed: purging the package deletes /usr/bin/speedtest.
    - name: Remove apt-installed speedtest packages
      ansible.builtin.apt:
        name: "{{ speedtest_legacy_packages }}"
        state: absent
        purge: true
        lock_timeout: 300
      register: speedtest_pkg_removed
      when: speedtest_legacy_packages | length > 0

    - name: Remove the Ookla apt repository
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ speedtest_legacy_files }}"
      notify: Update apt cache

    - name: Check the installed version
      ansible.builtin.command: "{{ speedtest_bin_path }} --version"
      register: speedtest_current
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Decide whether the binary needs installing
      ansible.builtin.set_fact:
        speedtest_needs_install: >-
          {{ speedtest_pkg_removed is changed
             or speedtest_current.rc != 0
             or ('Ookla ' ~ speedtest_version ~ '.') not in speedtest_current.stdout }}

    - name: Report pending install (check mode)
      ansible.builtin.debug:
        msg: "Would install speedtest {{ speedtest_version }} ({{ speedtest_arch }}) to {{ speedtest_bin_path }}"
      changed_when: true
      when: ansible_check_mode and speedtest_needs_install

    # Skipped in check mode: tempfile/unarchive can't simulate a download.
    - name: Download and install the binary
      when: speedtest_needs_install and not ansible_check_mode
      block:
        - name: Create a temporary directory
          ansible.builtin.tempfile:
            state: directory
            suffix: speedtest
          register: speedtest_tmp

        - name: Download the tarball
          ansible.builtin.get_url:
            url: "{{ speedtest_url }}"
            dest: "{{ speedtest_tmp.path }}/speedtest.tgz"
            checksum: "{{ speedtest_checksums[speedtest_arch] }}"
            mode: "0600"

        - name: Extract the binary
          ansible.builtin.unarchive:
            src: "{{ speedtest_tmp.path }}/speedtest.tgz"
            dest: "{{ speedtest_tmp.path }}"
            include: [speedtest]
            remote_src: true

        - name: Install the binary
          ansible.builtin.copy:
            src: "{{ speedtest_tmp.path }}/speedtest"
            dest: "{{ speedtest_bin_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"

      always:
        - name: Remove the temporary directory
          ansible.builtin.file:
            path: "{{ speedtest_tmp.path }}"
            state: absent
          when: speedtest_tmp.path is defined

    - name: Verify the binary runs
      ansible.builtin.command: "{{ speedtest_bin_path }} --version"
      register: speedtest_version_out
      changed_when: false
      when: not ansible_check_mode

    - name: Show installed version
      ansible.builtin.debug:
        msg: "{{ speedtest_version_out.stdout_lines | first }}"
      when: speedtest_version_out is not skipped
