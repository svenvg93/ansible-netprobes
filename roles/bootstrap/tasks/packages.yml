---
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ bootstrap_install_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: bootstrap_install_packages | length > 0

- name: Remove unwanted packages
  ansible.builtin.apt:
    name: "{{ bootstrap_remove_packages }}"
    state: absent
    purge: true
    autoremove: true
    lock_timeout: 300
  when: bootstrap_remove_packages | length > 0

# snapd needs its snaps removed in order before the package can go, so it has its own tasks.
- name: Remove snap
  ansible.builtin.import_tasks: remove_snap.yml
