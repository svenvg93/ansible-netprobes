# Netprobes, reached over Tailscale SSH via their MagicDNS names.
netprobes:
  vars:
    tailnet_domain: tail294b9a.ts.net
    ansible_host: "{{ inventory_hostname }}.{{ tailnet_domain }}"
    # Must be allowed in the tailnet policy's "ssh" rule ("action": "accept", not "check").
    # Logged in as root, so no sudo/become (and no -K) is needed.
    ansible_user: root
    ansible_become: false
    # Trust a host's key on first connect instead of prompting (changed keys still fail).
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
  hosts:
    netprobe[01:16]:

# The machine Ansible runs on (also hosts the Beszel hub). Only gets maintenance.
controller:
  hosts:
    cpe-srv:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      # Ansible can't reboot the machine it runs on; reboot it by hand when reported.
      maintenance_reboot_if_required: false
